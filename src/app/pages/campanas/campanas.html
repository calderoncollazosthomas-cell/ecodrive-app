
<section class="container py-5">

  <div class="text-center mb-5">
    <h1 class="fw-bold text-success">Nuestras campañas</h1>
    <p class="text-muted">
      Participa en nuestras iniciativas y ayúdanos a construir
      un futuro más sostenible.
    </p>
  </div>

  <div class="row g-4">

    @for (campaign of campaigns; track campaign.id) {
      <div class="col-md-6 col-lg-4">

        <div class="card h-100 shadow-sm border-0 campaign-card">

          <img
            [src]="campaign.image"
            [alt]="campaign.title"
            class="card-img-top campaign-image"
          >

          <div class="card-body d-flex flex-column">

            <span class="badge bg-success align-self-start mb-3">
              {{ campaign.status }}
            </span>

            <h5 class="card-title fw-bold">
              {{ campaign.title }}
            </h5>

            <p class="card-text text-muted">
              {{ campaign.description }}
            </p>

            <p class="small mb-2">
              <i class="bi bi-calendar-event text-success"></i>
              {{ campaign.date }}
            </p>

            <p class="small mb-3">
              <i class="bi bi-geo-alt text-success"></i>
              {{ campaign.location }}
            </p>

            <a
              [routerLink]="['/campanas', campaign.id]"
              class="btn btn-success mt-auto rounded-pill"
            >
              Ver detalles
              <i class="bi bi-arrow-right"></i>
            </a>

          </div>
        </div>

      </div>
    }

  </div>
</section>
